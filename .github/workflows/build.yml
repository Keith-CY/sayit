name: Build and Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package SayIt
    runs-on: macos-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Define short SHA
        id: build_vars
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install xcpretty
        run: sudo gem install xcpretty

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/WhisperModels
          key: ${{ runner.os }}-whisper-models-v1

      - name: Run SwiftLint (strict)
        run: swiftlint --strict --config .swiftlint.yml
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
    
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project SayIt.xcodeproj -scheme SayIt
      
      - name: Build Project
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project SayIt.xcodeproj \
            -scheme SayIt \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        continue-on-error: false
      
      - name: Archive macOS App
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project SayIt.xcodeproj \
            -scheme SayIt \
            -destination 'platform=macOS,arch=arm64' \
            -archivePath "$RUNNER_TEMP/SayIt.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
          
      - name: Export app artifact
        run: |
          mkdir -p "$RUNNER_TEMP/sayit-artifacts"
          cp -R "$RUNNER_TEMP/SayIt.xcarchive/Products/Applications/SayIt.app" "$RUNNER_TEMP/sayit-artifacts/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/sayit-artifacts/SayIt.app" \
            "$RUNNER_TEMP/SayIt-macOS-${{ steps.build_vars.outputs.short_sha }}.zip"

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SayIt.xcodeproj \
            -scheme SayIt \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SayIt-macOS-${{ github.sha }}
          path: ${{ runner.temp }}/SayIt-macOS-${{ steps.build_vars.outputs.short_sha }}.zip
          if-no-files-found: error

  release:
    name: Publish Release Package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: SayIt-macOS-${{ github.sha }}
          path: ${{ github.workspace }}/dist

      - name: Prepare release assets
        run: |
          set -o pipefail
          short_sha="${GITHUB_SHA:0:7}"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"
          ls -la "${{ github.workspace }}/dist"
          mv "${{ github.workspace }}/dist/SayIt-macOS-${GITHUB_SHA:0:7}.zip" \
            "${{ github.workspace }}/SayIt-macOS-main-${short_sha}.zip"
          shasum -a 256 "${{ github.workspace }}/SayIt-macOS-main-${short_sha}.zip" > "${{ github.workspace }}/SayIt-macOS-main-${short_sha}.sha256"

      - name: Publish pre-release for main
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: main-${{ github.sha }}
          name: "SayIt main @${{ env.SHORT_SHA }}"
          prerelease: true
          files: |
            ${{ github.workspace }}/SayIt-macOS-main-${{ env.SHORT_SHA }}.zip
            ${{ github.workspace }}/SayIt-macOS-main-${{ env.SHORT_SHA }}.sha256
