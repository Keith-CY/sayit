name: Build and Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package SayIt
    runs-on: macos-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Define short SHA
        id: build_vars
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install xcpretty
        run: sudo gem install xcpretty

      - name: Cache Whisper models
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/WhisperModels
          key: ${{ runner.os }}-whisper-models-v1

      - name: Run SwiftLint (strict)
        run: swiftlint --strict --no-cache --config .swiftlint.yml
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
    
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project SayIt.xcodeproj -scheme SayIt
      
      - name: Build Project
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project SayIt.xcodeproj \
            -scheme SayIt \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        continue-on-error: false
      
      - name: Archive macOS App
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project SayIt.xcodeproj \
            -scheme SayIt \
            -destination 'platform=macOS,arch=arm64' \
            -archivePath "$RUNNER_TEMP/SayIt.xcarchive" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
          
      - name: Export app artifact
        run: |
          mkdir -p "$RUNNER_TEMP/sayit-artifacts"
          ditto "$RUNNER_TEMP/SayIt.xcarchive/Products/Applications/SayIt.app" "$RUNNER_TEMP/sayit-artifacts/SayIt.app"
          xattr -cr "$RUNNER_TEMP/sayit-artifacts/SayIt.app"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/sayit-artifacts/SayIt.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/sayit-artifacts/SayIt.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/sayit-artifacts/SayIt.app" \
            "$RUNNER_TEMP/SayIt-macOS-${{ steps.build_vars.outputs.short_sha }}.zip"

      - name: Run Tests
        env:
          SAYIT_TEST_DISABLE_KEYCHAIN: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project SayIt.xcodeproj \
            -scheme SayIt \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: SayIt-macOS-${{ github.sha }}
          path: ${{ runner.temp }}/SayIt-macOS-${{ steps.build_vars.outputs.short_sha }}.zip
          if-no-files-found: error
